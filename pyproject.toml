[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekpempsis"
version = "0.1.0"
description = "Synchronizes, validates, and explicitly publishes declared repository surfaces."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-PyYAML>=6.0"]

[project.scripts]
ekpempsis = "ekpempsis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
